<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Captador de Notas Fiscais</title>
    <script>
      // Aplica o tema salvo (ou o do sistema) antes de desenhar a página, evitando piscar em branco
      try {
        var tema = localStorage.getItem("captador_tema");
        if (tema === "escuro" || (!tema && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <script>
      // Exige login a cada nova aba/janela: sem a marca da sessão atual, encerra e volta ao login
      try {
        if (!sessionStorage.getItem("captador_auth")) location.replace("/logout");
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="shortcut icon" href="./logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
